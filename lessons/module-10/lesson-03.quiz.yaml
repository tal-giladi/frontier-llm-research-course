- id: q1
  question: >-
    A rephrased arm beats repeating the originals by 0.04 nats at equal training tokens. Generating the
    rephrasings cost 9 times the FLOPs of one training run. A colleague writes "rephrasing is free quality".
    What is the correct way to report the result?
  options:
    - >-
      As a gain at equal training tokens, with the generator's compute stated as part of the cost of the data.
    - >-
      As a gain only if it survives at equal wall-clock, since FLOPs are not a meaningful unit for generation.
    - >-
      As no gain, since any arm that costs more compute must lose a compute-matched comparison by definition.
    - >-
      As a gain without the compute, because generation happens once and is not part of training.
  correct: 0
  explanation: >-
    The comparison axis was equal training tokens and the gain is real on that axis; the generator's compute
    is part of the data's cost and must be reported next to it so readers can judge it at their reuse rate. It
    is not automatically a loss at equal compute: one generation can serve many runs.

- id: q2
  question: >-
    You rephrase 10,000 math pages with a small model. Automatic checks show 95% of numbers kept and 2%
    invented, high novelty and normal diversity. What should you still do before adding the data to a mixture?
  options:
    - >-
      Nothing further, since numbers kept and novelty together cover the main ways a rewrite can fail.
    - >-
      Regenerate with temperature 0, since sampled outputs always contain more errors than greedy ones.
    - >-
      Drop the originals from the mixture, since keeping both would double-count the same knowledge.
    - >-
      Read a sample of pairs for changed relations and invented entities, and run the leakage check on the
      outputs.
  correct: 3
  explanation: >-
    Cheap checks miss wrong relations and invented people, and a generator can reproduce memorised benchmark
    items, so outputs need their own decontamination. Every reported recipe keeps real data, and greedy
    decoding tends to make rewrites more uniform.

- id: q3
  question: >-
    Your rephrased arm wins clearly on a QA-style probe that was generated by the same model, and loses
    slightly on the original documents. What is the main alternative explanation you must rule out?
  options:
    - >-
      The probe has fewer tokens than the originals, so its loss is noisier and favours every arm equally.
    - >-
      The rephrased arm saw more unique documents, so it is not a matched comparison at equal tokens.
    - >-
      The probe shares the generator's style, so the gain may be style matching rather than learned facts.
    - >-
      The originals contain more numbers, and numbers always have higher loss under any tokenizer.
  correct: 2
  explanation: >-
    Text from the same generator shares vocabulary and phrasing, which lowers loss without any knowledge
    transfer. A probe in a different form, or written by a different model, plus the loss on the originals,
    separates style from content.

- id: q4
  question: >-
    Kimi K2 reports SimpleQA 23.76 for 10 epochs of the original data, 27.39 for one rephrasing repeated 10
    times and 28.94 for 10 different rephrasings once each. What does this comparison hold fixed, and what
    does it suggest?
  options:
    - >-
      It holds the number of unique documents fixed and suggests that more unique documents improve accuracy.
    - >-
      It holds training tokens fixed and suggests that varied rewrites beat repeating the same text.
    - >-
      It holds generator compute fixed and suggests that rephrasing is cheaper than collecting new data.
    - >-
      It holds model size fixed across a scaling ladder and suggests the gain grows with model size.
  correct: 1
  explanation: >-
    All three strategies use the same total tokens; only how the repeats are spent changes. More varied
    rewrites do better on a knowledge benchmark, which is evidence for rephrasing as a better use of
    repetition, from one lab on one benchmark.
